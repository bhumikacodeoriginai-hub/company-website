<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" width="400" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="30%" style="stop-color:#d4a418"/>
      <stop offset="60%" style="stop-color:#c8960c"/>
      <stop offset="100%" style="stop-color:#a87e00"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#e6b820"/>
      <stop offset="100%" style="stop-color:#c8960c"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(212,164,24,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="200" fill="transparent"/>
  
  <!-- C Letter - Angular Gold -->
  <path d="M55 45 L85 30 L85 50 L65 60 L65 90 L85 100 L85 120 L55 105 L40 85 L40 65 Z" 
        fill="url(#goldGrad)" filter="url(#shadow)"/>
  
  <!-- O/Circuit Element -->
  <circle cx="110" cy="75" r="28" fill="none" stroke="url(#goldGrad2)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="110" cy="75" r="16" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  
  <!-- Circuit dots/lines -->
  <circle cx="142" cy="58" r="4" fill="url(#goldGrad)"/>
  <circle cx="150" cy="75" r="4" fill="url(#goldGrad)"/>
  <circle cx="142" cy="92" r="4" fill="url(#goldGrad)"/>
  <line x1="138" y1="58" x2="148" y2="58" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="138" y1="75" x2="152" y2="75" stroke="url(#goldGrad)" stroke-width="2"/>
  <line x1="138" y1="92" x2="148" y2="92" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Text: CodeOrigin.ai -->
  <text x="40" y="165" font-family="Inter, system-ui, sans-serif" font-size="32" font-weight="800" letter-spacing="-0.5">
    <tspan fill="url(#goldGrad)">Code</tspan><tspan fill="#ffffff">Origin</tspan><tspan fill="url(#goldGrad)">.ai</tspan>
  </text>
</svg>